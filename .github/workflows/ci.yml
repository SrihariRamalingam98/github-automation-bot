name: Migration checks

on:
    push:
        branches:
            - main
            - feature/angular-nestjs-migration
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    verify:
        runs-on: ubuntu-latest

        services:
            postgres:
                image: postgres:16
                env:
                    POSTGRES_USER: bot
                    POSTGRES_PASSWORD: ci-only-password
                    POSTGRES_DB: bot_test
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U bot -d bot_test"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            TEST_DATABASE_URL: postgresql://bot:ci-only-password@localhost:5432/bot_test

        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm

            - run: npm ci --include=dev
            - run: npm run format:check
            - run: npm run lint
            - run: npm run build
            - run: node scripts/verify-production-http.cjs
            - run: npm test
